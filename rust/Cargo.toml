[package]
name = "rust_lib_matrix_client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1"
flutter_rust_bridge = "=2.13.0"
futures-util = "0.3"
matrix-sdk = { version = "=0.19.1", default-features = false, features = [
    "e2e-encryption",
    "automatic-room-key-forwarding",
    "bundled-sqlite",
    "rustls-aws-lc-rs",
] }
matrix-sdk-ui = { version = "=0.19.1", default-features = false }
rand = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
url = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
